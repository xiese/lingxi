name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与静态检查（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt
          pip install -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q scripts tests

      - name: 版本一致性
        run: python scripts/test_version_consistency.py

      - name: 单元测试
        run: python -m pytest tests/ -q

      - name: 启动服务并冒烟测试
        run: |
          set -e
          export KB_ROOT="$RUNNER_TEMP/kb-ci"
          mkdir -p "$KB_ROOT/笔记"
          python scripts/kb-server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8899/health > /dev/null; then
              echo "服务已就绪"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "服务启动超时，日志如下："
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 1
          done

          echo "—— /health ——"
          curl -sf http://127.0.0.1:8899/health | head -c 400; echo
          echo "—— /web/ ——"
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8899/web/
          echo "—— 安全响应头 ——"
          curl -sI http://127.0.0.1:8899/web/ | grep -i "content-security-policy" || {
            echo "缺少 Content-Security-Policy"; exit 1; }
